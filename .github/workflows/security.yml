name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "10 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies, licenses, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Audit dependencies and licenses
        run: |
          pip-audit
          # Apply the deny-list to metadata and legacy classifier values.
          pip-licenses --from=all --partial-match --fail-on="GPL;LGPL;AGPL"
      - name: Generate and validate SBOM
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json
          jq -e '(.bomFormat == "CycloneDX") and (.specVersion | strings) and (.components | type == "array" and length > 0)' sbom.json >/dev/null

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
