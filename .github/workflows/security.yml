name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "10 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies, licenses, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Audit dependencies and licenses
        run: |
          pip-audit
          pip-licenses --fail-on="GPL;LGPL;AGPL"
      - name: Generate and validate SBOM
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json
          jq -e '(.spdxVersion | strings) and (.packages | type == "array" and length > 0)' sbom.json >/dev/null

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
