name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install release tools
        run: |
          python -m pip install "uv==0.8.22"
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check tag, version, and changelog
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '\r\n' < VERSION)"
          grep -Fq "## [$version]" CHANGELOG.md
      - name: Build immutable artifacts
        run: python -m build --sdist --wheel
      - name: Validate artifacts and create SBOM
        run: |
          twine check --strict dist/*
          cyclonedx-py environment --output-format json --output-file sbom.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          retention-days: 90
          path: |
            dist/*
            sbom.json
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
      - name: Smoke-install the published version
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          for attempt in {1..12}; do
            if "$RUNNER_TEMP/release-smoke/bin/python" -m pip install \
              --disable-pip-version-check --no-cache-dir \
              --index-url https://pypi.org/simple \
              "sharepoint_manager==${GITHUB_REF_NAME#v}"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          "$RUNNER_TEMP/release-smoke/bin/python" -c \
            "import sharepoint_manager; print(sharepoint_manager.__version__)"
