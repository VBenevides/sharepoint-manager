name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install release tools
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install twine==6.1.0 cyclonedx-bom==7.1.0
      - name: Check tag, version, and changelog
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '\r\n' < VERSION)"
          grep -Fq "## [$version]" CHANGELOG.md
      - name: Build immutable artifacts
        run: python -m build --sdist --wheel
      - name: Validate artifacts and create SBOM
        run: |
          twine check --strict dist/*
          cyclonedx-py environment --output-format json --output-file sbom.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          retention-days: 90
          path: |
            dist/*
            sbom.json
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Smoke-install the published version
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install \
            "sharepoint_manager==${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/release-smoke/bin/python" -c \
            "import sharepoint_manager; print(sharepoint_manager.__version__)"
