name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          if [ "${{ matrix.dependencies }}" = minimum ]; then
            python -m pip install --force-reinstall "httpx==0.27.0" "msal==1.35.0" "requests==2.33.0"
          fi
      - name: Compile and run focused checks
        run: |
          python -m compileall -q sharepoint_manager verification tests
          python -m unittest discover -s tests -v
      - name: Dependency consistency
        run: |
          python -m pip check
          pip-audit

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Format, lint, and type check
        run: |
          ruff format --check tests verification sharepoint_manager
          ruff check --select E4,E7,E9,F --ignore E402 tests verification sharepoint_manager
          pyright sharepoint_manager

  artifacts:
    name: Build and inspect artifacts
    runs-on: ubuntu-latest
    needs: [checks, static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build and audit tools
        run: python -m pip install ".[dev]"
      - name: Build
        run: python -m build --sdist --wheel
      - name: Install and inspect wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import sharepoint_manager; print(sharepoint_manager.__version__)"
          twine check --strict dist/*
      - name: Dependency audit, license policy, and SBOM
        run: |
          pip-audit
          pip-licenses --fail-on="GPL;LGPL;AGPL"
          cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-audit
          path: |
            dist/*
            sbom.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
