name: Staging integration

on:
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Least-privilege staging smoke
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: sharepoint-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install runtime
        run: python -m pip install .
      - name: Verify staging configuration
        env:
          SITE_URL: ${{ secrets.SP_STAGING_SITE_URL }}
          CLIENT_ID: ${{ secrets.SP_STAGING_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SP_STAGING_CLIENT_SECRET }}
          DRIVE_NAME: ${{ secrets.SP_STAGING_DRIVE_NAME }}
          FOLDER: ${{ secrets.SP_STAGING_FOLDER }}
        run: test -n "$SITE_URL" -a -n "$CLIENT_ID" -a -n "$CLIENT_SECRET" -a -n "$DRIVE_NAME" -a -n "$FOLDER"
      - name: Run isolated staging smoke
        env:
          SP_STAGING_SITE_URL: ${{ secrets.SP_STAGING_SITE_URL }}
          SP_STAGING_CLIENT_ID: ${{ secrets.SP_STAGING_CLIENT_ID }}
          SP_STAGING_CLIENT_SECRET: ${{ secrets.SP_STAGING_CLIENT_SECRET }}
          SP_STAGING_DRIVE_NAME: ${{ secrets.SP_STAGING_DRIVE_NAME }}
          SP_STAGING_FOLDER: ${{ secrets.SP_STAGING_FOLDER }}
          SP_STAGING_DENIED_SITE_URL: ${{ secrets.SP_STAGING_DENIED_SITE_URL }}
          SP_STAGING_ALLOW_DESTRUCTIVE: ${{ vars.SP_STAGING_ALLOW_DESTRUCTIVE }}
        run: python verification/staging_smoke.py
